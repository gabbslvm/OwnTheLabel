<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Own The Label Co.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="shop.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-xl navbar-light otl-navbar is-scrolled" id="site-header">
            <div class="container-fluid px-3 px-xl-5">
                <a class="navbar-brand nav-title d-none d-xl-block" href="../index.html">Own The Label<sup>TM</sup></a>
                <a class="navbar-brand logo order-xl-last" href="../index.html">
                    <img src="../img/logo2.png" alt="Own The Label">
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="../shop/shop.html">Shop</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../brand/brand.html">Brand</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../contact/Contact.html">Contact</a>
                        </li>
                        <li class="nav-item nav-cart">
                            <a class="nav-link" href="../checkout/checkout.html">Cart (<span class="cart-count">0</span>)</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        
        <section id="shop-products">
            <div class="container">
                <p class="section-eyebrow">THE COLLECTION</p>
                <h1 class="page-title">Shop</h1>
                <div class="row">

                    <aside id="filters" class="col-lg-3 col-xl-2">
                        <button class="btn btn-outline-otl btn-block d-lg-none mb-3 filter-toggle" type="button"
                            data-toggle="collapse" data-target="#filters-body">FILTERS</button>

                        <div id="filters-body" class="collapse">
                            <div class="filter-group">
                                <h2>CATEGORIES</h2>
                                <div class="form-check">
                                    <input class="form-check-input f-category" type="checkbox" id="cat-hoodies" value="Hoodies">
                                    <label class="form-check-label" for="cat-hoodies">Hoodies</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input f-category" type="checkbox" id="cat-shirts" value="Shirts">
                                    <label class="form-check-label" for="cat-shirts">Shirts</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input f-category" type="checkbox" id="cat-shorts" value="Shorts">
                                    <label class="form-check-label" for="cat-shorts">Shorts</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input f-category" type="checkbox" id="cat-barong" value="Barong">
                                    <label class="form-check-label" for="cat-barong">Barong</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input f-category" type="checkbox" id="cat-polo" value="Polo">
                                    <label class="form-check-label" for="cat-polo">Polo</label>
                                </div>
                            </div>

                            <div class="filter-group">
                                <h2>SIZE</h2>
                                <div class="form-check">
                                    <input class="form-check-input f-size" type="checkbox" id="size-small" value="Small">
                                    <label class="form-check-label" for="size-small">Small</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input f-size" type="checkbox" id="size-medium" value="Medium">
                                    <label class="form-check-label" for="size-medium">Medium</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input f-size" type="checkbox" id="size-large" value="Large">
                                    <label class="form-check-label" for="size-large">Large</label>
                                </div>
                            </div>

                            <div class="filter-group">
                                <h2>PRICE</h2>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="price" id="price-all"
                                        data-min="0" data-max="999999" checked>
                                    <label class="form-check-label" for="price-all">All prices</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="price" id="price-low"
                                        data-min="0" data-max="999.99">
                                    <label class="form-check-label" for="price-low">Under ₱1,000</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="price" id="price-mid"
                                        data-min="1000" data-max="1500">
                                    <label class="form-check-label" for="price-mid">₱1,000 – ₱1,500</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="price" id="price-high"
                                        data-min="1500.01" data-max="999999">
                                    <label class="form-check-label" for="price-high">Above ₱1,500</label>
                                </div>
                            </div>

                            <button type="button" id="clear-filters" class="btn btn-outline-otl btn-sm btn-block mb-4">
                                CLEAR FILTERS
                            </button>
                        </div>
                    </aside>

                    <div class="col-lg-9 col-xl-10">
                        <div class="product-toolbar d-flex justify-content-between align-items-center">
                            <p id="result-count" class="mb-0"></p>
                            <select id="sort-select" class="form-control sort-select">
                                <option value="featured">Featured</option>
                                <option value="newest">Newest</option>
                                <option value="low">Price: Low to High</option>
                                <option value="high">Price: High to Low</option>
                            </select>
                        </div>

                        <h2 class="sr-only">Products</h2>
                        <div class="row" id="product-grid">
                            <p class="col-12 text-center text-muted">Loading products...</p>
                        </div>

                        <p id="no-results" class="text-center text-muted d-none">No products match your filters.</p>

                        <nav>
                            <ul class="pagination justify-content-center" id="pagination"></ul>
                        </nav>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <footer id="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <a href="../index.html" class="footer-logo">
                        <img src="../img/logo3.png" alt="Own The Label">
                    </a>
                </div>
                <div class="col-md-6 text-center">
                    <p class="footer-tagline">Same Brand, Never The Same Look.</p>
                </div>
                <div class="col-md-3 text-right">
                    <div class="social-icons">
                        <a href="https://instagram.com/ownthelabel.co" aria-label="Instagram" target="_blank" rel="noopener">
                            <img src="../img/instagram-logo-facebook-svgrepo-com.svg" alt="Instagram" class="social-icon">
                        </a>
                    </div>
                </div>
            </div>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <p class="copyright">© 2025 Own The Label Co.</p>
                </div>
                <div class="col-md-6 text-right">
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/shared.js"></script>
    <script src="shop.js"></script>
</body>

</html>
