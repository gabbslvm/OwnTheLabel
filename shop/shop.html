<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="shop.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-xl navbar-light otl-navbar is-scrolled" id="site-header">
            <div class="container-fluid px-3 px-xl-5">
                <a class="navbar-brand nav-title d-none d-xl-block" href="/index.html">Own The Label<sup>TM</sup></a>
                <a class="navbar-brand logo order-xl-last" href="/index.html">
                    <img src="/img/logo2.png" alt="Own The Label">
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/shop/shop.html">Shop</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/brand/brand.html">Brand</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/contact/Contact.html">Contact</a>
                        </li>
                    </ul>
                    <a href="/checkout/checkout.html" class="btn btn-otl btn-sm ml-xl-auto mr-xl-4 mt-2 mt-xl-0">
                        Checkout (<span class="cart-count">0</span>)
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="sr-only">Shop</h1>
        <section id="shop-products">
            <div class="container">
                <div class="row">
                    <aside id="filters" class="col-lg-2">
                        <div class="filter-group">
                            <h2>CATEGORIES</h2>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="hoodies">
                                <label class="form-check-label" for="hoodies">Hoodies</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="shirts">
                                <label class="form-check-label" for="shirts">Shirts</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="pants">
                                <label class="form-check-label" for="pants">Pants</label>
                            </div>
                        </div>
                        <div class="filter-group">
                            <h2>SIZE</h2>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="small">
                                <label class="form-check-label" for="small">Small</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="medium">
                                <label class="form-check-label" for="medium">Medium</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="large">
                                <label class="form-check-label" for="large">Large</label>
                            </div>
                        </div>
                        <div class="filter-group">
                            <h2>COLOR</h2>
                            <div class="color-options">
                                <span class="color-swatch bg-dark"></span>
                                <span class="color-swatch bg-white"></span>
                            </div>
                        </div>
                        <div class="filter-group">
                            <h2>PRICE</h2>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="price" id="under1000">
                                <label class="form-check-label" for="under1000">Under ₱1000</label>
                            </div>
                        </div>
                    </aside>

                    <div class="col-lg-10">
                        <div class="product-toolbar d-flex justify-content-end">
                            <select class="form-control sort-select">
                                <option>Featured</option>
                                <option>Newest</option>
                                <option>Price: Low to High</option>
                                <option>Price: High to Low</option>
                            </select>
                        </div>

                        <h2 class="sr-only">Products</h2>
                        <div class="row">
                            <div class="col-lg-4 col-md-6 mb-5">
                                <div class="product-card" data-id="1" data-name="Essential Hoodie" data-price="1299"
                                    data-img="/img/product1.jpg">
                                    <img src="/img/product1.jpg" alt="Essential Hoodie" class="img-fluid">
                                    <h3>Essential Hoodie</h3>
                                    <p class="product-price">₱1,299</p>
                                    <select class="form-control form-control-sm size-select">
                                        <option>Small</option>
                                        <option>Medium</option>
                                        <option>Large</option>
                                    </select>
                                    <button type="button" class="btn btn-otl btn-sm add-to-cart">Add to Cart</button>
                                </div>
                            </div>
                            <div class="col-lg-4 col-md-6 mb-5">
                                <div class="product-card" data-id="2" data-name="Classic Tee" data-price="699"
                                    data-img="/img/product2.jpg">
                                    <img src="/img/product2.jpg" alt="Classic Tee" class="img-fluid">
                                    <h3>Classic Tee</h3>
                                    <p class="product-price">₱699</p>
                                    <select class="form-control form-control-sm size-select">
                                        <option>Small</option>
                                        <option>Medium</option>
                                        <option>Large</option>
                                    </select>
                                    <button type="button" class="btn btn-otl btn-sm add-to-cart">Add to Cart</button>
                                </div>
                            </div>
                            <div class="col-lg-4 col-md-6 mb-5">
                                <div class="product-card" data-id="3" data-name="Cargo Pants" data-price="1499"
                                    data-img="/img/product3.jpg">
                                    <img src="/img/product3.jpg" alt="Cargo Pants" class="img-fluid">
                                    <h3>Cargo Pants</h3>
                                    <p class="product-price">₱1,499</p>
                                    <select class="form-control form-control-sm size-select">
                                        <option>Small</option>
                                        <option>Medium</option>
                                        <option>Large</option>
                                    </select>
                                    <button type="button" class="btn btn-otl btn-sm add-to-cart">Add to Cart</button>
                                </div>
                            </div>
                        </div>

                        <nav>
                            <ul class="pagination justify-content-center">
                                <li class="page-item active">
                                    <a class="page-link" href="#">1</a>
                                </li>
                                <li class="page-item">
                                    <a class="page-link" href="#">2</a>
                                </li>
                                <li class="page-item">
                                    <a class="page-link" href="#">3</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <a href="/index.html" class="footer-logo">
                        <img src="/img/logo3.png" alt="Own The Label">
                    </a>
                </div>
                <div class="col-md-6 text-center">
                    <p class="footer-tagline">
                        Same Brand Never The Same Look
                    </p>
                </div>
                <div class="col-md-3 text-right">
                    <div class="social-icons">
                        <a href="https://instagram.com/ownthelabel.co" aria-label="Instagram">
                            <img src="/img/instagram-logo-facebook-svgrepo-com.svg" alt="Instagram" class="social-icon">
                        </a>
                    </div>
                </div>
            </div>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <p class="copyright">
                        © 2025 Own The Label Co.
                    </p>
                </div>
                <div class="col-md-6 text-right">
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cart.js"></script>
    <script>
        document.querySelectorAll(".add-to-cart").forEach(btn => {
            btn.addEventListener("click", () => {
                const card = btn.closest(".product-card");
                addToCart({
                    id: card.dataset.id,
                    name: card.dataset.name,
                    price: Number(card.dataset.price),
                    img: card.dataset.img,
                    size: card.querySelector(".size-select").value
                });
                btn.textContent = "Added ✓";
                setTimeout(() => btn.textContent = "Add to Cart", 1000);
            });
        });
    </script>
</body>

</html>
